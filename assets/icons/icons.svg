<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    RESOLVIA — Sprite de iconos
    Línea fina (1.5), esquinas rectas, acento naranja en un solo trazo.
    Uso: <svg class="icon"><use href="assets/icons/icons.svg#i-scope"></use></svg>
    El color base es currentColor; el acento usa la variable CSS icon-accent (naranja por defecto).
  -->

  <!-- ===== Utilitarios ===== -->
  <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
    <path d="M4 12h15M13 6l6 6-6 6"/>
  </symbol>

  <symbol id="i-arrow-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
    <path d="M12 4v15M6 13l6 6 6-6"/>
  </symbol>

  <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
    <path d="M4 5h16v11H10l-4 3.5V16H4z"/>
    <path d="M8 9.5h8M8 12.5h5" style="stroke: var(--icon-accent, #D96B27)"/>
  </symbol>

  <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
    <rect x="7" y="3" width="10" height="18" rx="1.5"/>
    <path d="M11 18h2" style="stroke: var(--icon-accent, #D96B27)"/>
  </symbol>

  <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
    <rect x="3" y="5.5" width="18" height="13"/>
    <path d="M3.5 6.5 12 13l8.5-6.5" style="stroke: var(--icon-accent, #D96B27)"/>
  </symbol>

  <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
    <path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/>
    <circle cx="12" cy="10" r="2.2" style="stroke: var(--icon-accent, #D96B27)"/>
  </symbol>

  <!-- ===== Confianza ===== -->

  <!-- Alcance definido: marco con cotas -->
  <symbol id="i-scope" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
    <path d="M6 9v17h20V9"/>
    <path d="M6 4v3M26 4v3M6 5.5h20" style="stroke: var(--icon-accent, #D96B27)"/>
    <path d="M11 15h10M11 19.5h6"/>
  </symbol>

  <!-- Presupuestos claros: documento con partidas y total -->
  <symbol id="i-budget" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
    <path d="M8 4h12l5 5v19H8z"/>
    <path d="M20 4v5h5"/>
    <path d="M12 14h9M12 18h9"/>
    <path d="M12 23h9" style="stroke: var(--icon-accent, #D96B27)" stroke-width="2"/>
  </symbol>

  <!-- Seguimiento documentado: bitácora con registros -->
  <symbol id="i-log" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
    <path d="M7 5h18v23H7z"/>
    <path d="M11 11l1.5 1.5L15 10M11 17l1.5 1.5L15 16" style="stroke: var(--icon-accent, #D96B27)"/>
    <path d="M18 11.5h3.5M18 17.5h3.5M11 23h10.5"/>
  </symbol>

  <!-- Evidencias de avance: fotografía con marca de tiempo -->
  <symbol id="i-evidence" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="round">
    <path d="M4 7h24v18H4z"/>
    <path d="M4 21l7-6 5 4 4-3 8 6"/>
    <circle cx="21.5" cy="11.5" r="1.8" style="stroke: var(--icon-accent, #D96B27)"/>
  </symbol>

  <!-- Comunicación directa: dos mensajes -->
  <symbol id="i-direct" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
    <path d="M4 6h16v10H10l-4 3v-3H4z"/>
    <path d="M24 12h4v10h-2v3l-4-3h-8v-3" style="stroke: var(--icon-accent, #D96B27)"/>
  </symbol>

  <!-- Control de cambios: versión A → versión B -->
  <symbol id="i-changes" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
    <path d="M5 6h9v9H5z"/>
    <path d="M18 17h9v9h-9z" style="stroke: var(--icon-accent, #D96B27)"/>
    <path d="M9.5 19v3.5H14M22.5 13V9.5H18"/>
    <path d="M12.5 20.5 14.5 22.5 12.5 24.5M20 7.5l-2 2 2 2"/>
  </symbol>

  <!-- Responsabilidad: firma de conformidad -->
  <symbol id="i-sign" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="round">
    <path d="M5 26h22"/>
    <path d="M6 21c3-5 5-9 7-9s-1 7 1 7 3-5 5-5 1 3 3 3 3-2 4-3" style="stroke: var(--icon-accent, #D96B27)"/>
    <path d="M22 4l5 5-3 3-5-5z"/>
  </symbol>

  <!-- Entrega: llave -->
  <symbol id="i-handover" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
    <circle cx="10" cy="16" r="5.5"/>
    <circle cx="10" cy="16" r="1.5" style="stroke: var(--icon-accent, #D96B27)"/>
    <path d="M15.5 16H28M24 16v4M20 16v3"/>
  </symbol>
</svg>
