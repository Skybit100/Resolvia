  <!--
    GitHub Pages sirve este 404 en cualquier ruta inexistente (incluso anidada),
    así que las rutas relativas necesitan una base fija:
    - dominio propio (resolvia.com.mx)        → base "/"
    - usuario.github.io/repositorio/...        → base "/repositorio/"
    Script de configuración justificado: debe ejecutarse antes de cargar CSS.
  -->
  <script>
    (function () {
      var host = location.hostname;
      var first = location.pathname.split("/")[1] || "";
      var base = /\.github\.io$/.test(host) && first ? "/" + first + "/" : "/";
      document.write('<base href="' + base + '">');
    })();
  </script>
